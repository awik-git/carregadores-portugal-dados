# Publishes compact JSON copies of the MOBI.E open data feeds to two data branches:
#   data-chargers : chargers.json + meta.json  (daily)
#   data-status   : status.json + meta.json    (every 5 min by day, 15 min at night)
# Each branch holds a single commit that is replaced on every run, so the repository does not grow.
name: Publicar dados

on:
  schedule:
    - cron: '20 4 * * *'          # charger list, once a day (MOBI.E refreshes it daily)
    - cron: '*/5 6-23 * * *'      # live status, daytime
    - cron: '*/15 0-5 * * *'      # live status, night
  workflow_dispatch:
    inputs:
      kind:
        description: 'static ou status'
        required: true
        default: status

permissions:
  contents: write

concurrency:
  group: publish-${{ github.event.schedule == '20 4 * * *' && 'static' || inputs.kind || 'status' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIND: ${{ github.event.schedule == '20 4 * * *' && 'static' || inputs.kind || 'status' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - name: Previous published data
        run: |
          BRANCH=$([ "$KIND" = static ] && echo data-chargers || echo data-status)
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          mkdir -p prev
          if git fetch -q --depth 1 origin "$BRANCH" 2>/dev/null; then
            git show "origin/$BRANCH:meta.json" > prev/meta.json 2>/dev/null || true
          fi
      - run: node src/build.ts "$KIND"
      - name: Publish
        run: |
          if [ -f out/.skip ]; then echo "Nothing to publish."; exit 0; fi
          cd out
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "$KIND $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
