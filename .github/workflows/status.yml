# Live availability + prices: MOBI.E status feed -> data-status branch (status.json + meta.json).
# Times are off the round minutes on purpose: GitHub drops many scheduled runs at :00/:05 when busy.
name: Estado em tempo real

on:
  schedule:
    - cron: '2-59/5 6-23 * * *'   # every 5 min by day (UTC)
    - cron: '7-59/15 0-5 * * *'   # every 15 min at night
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish-one.yml
    with:
      kind: status
      branch: data-status
